services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aiklao
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiklao_dev_change_me}
      POSTGRES_DB: aiklao
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiklao -d aiklao"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://aiklao:${POSTGRES_PASSWORD:-aiklao_dev_change_me}@postgres:5432/aiklao
      NODE_ENV: production
      PORT: 3002
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PG_POOL_MAX: ${PG_POOL_MAX:-10}
      PG_SSL: ${PG_SSL:-false}
      SLOW_QUERY_MS: ${SLOW_QUERY_MS:-300}
      CHANNEL_ACCESS_TOKEN: ${CHANNEL_ACCESS_TOKEN}
      MOBILE_JWT_SECRET: ${MOBILE_JWT_SECRET}
      MOBILE_LINE_CHANNEL_ID: ${MOBILE_LINE_CHANNEL_ID}
      LINE_LOGIN_CHANNEL_ID: ${LINE_LOGIN_CHANNEL_ID}
      LIFF_ID: ${LIFF_ID}
      LIFF_URL: ${LIFF_URL}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    ports:
      - "${APP_PORT:-3002}:3002"

volumes:
  postgres-data: